<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prahari correlates thousands of security alerts into a short, ranked list of incidents, reports its own uncertainty, and starts the CERT-In clock when sensitive data is touched." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09101c" />
    <title>Prahari</title>
    <script>
      // Apply the saved theme before first paint so the projector never flashes white.
      try { var t = localStorage.getItem('prahari.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
